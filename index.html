<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adam Asmaca</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    background: #0f172a;
    color: #e2e8f0;
    font-family: system-ui, sans-serif;
    padding: 16px;
  }
  h1 { font-size: 1.5rem; }
  .hud { display: flex; gap: 20px; color: #94a3b8; font-size: .95rem; }
  .hud b { color: #4ade80; }
  .stage {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 14px;
    padding: 18px;
    display: flex;
    gap: 26px;
    align-items: center;
    flex-wrap: wrap;
    justify-content: center;
    max-width: 640px;
  }
  svg .part { stroke: #e2e8f0; stroke-width: 3.5; fill: none; stroke-linecap: round; }
  svg .frame { stroke: #64748b; stroke-width: 4; fill: none; stroke-linecap: round; }
  .word {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
    font-size: 1.6rem;
    font-weight: 800;
    letter-spacing: 2px;
  }
  .letter {
    width: 40px;
    height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-bottom: 3px solid #334155;
    color: #e2e8f0;
  }
  .letter.wrong { color: #f87171; border-color: #7f1d1d; }
  .keys {
    display: grid;
    grid-template-columns: repeat(13, 38px);
    gap: 6px;
    justify-content: center;
  }
  .keys button {
    height: 38px;
    background: #273449;
    color: #e2e8f0;
    border: 1px solid #334155;
    border-radius: 8px;
    font-weight: 800;
    cursor: pointer;
    font-size: .95rem;
  }
  .keys button:hover:not(:disabled) { background: #334155; }
  .keys button.hit { background: #166534; color: #dcfce7; border-color: transparent; }
  .keys button.miss { background: #7f1d1d; color: #fecaca; border-color: transparent; opacity: .7; }
  #msg { font-size: 1.05rem; text-align: center; min-height: 1.4em; }
  button.big {
    background: #22c55e;
    color: #052e16;
    border: none;
    padding: 10px 24px;
    font-size: 1rem;
    font-weight: 800;
    border-radius: 10px;
    cursor: pointer;
  }
  button.big:hover { background: #4ade80; }
  .hint { color: #64748b; font-size: .8rem; text-align: center; }
</style>
</head>
<body>
  <h1>🎩 Adam Asmaca</h1>
  <div class="hud">
    <span>Skor: <b id="score">0</b></span>
    <span>Kalan hak: <b id="lives">6</b></span>
  </div>

  <div class="stage">
    <svg width="170" height="200" viewBox="0 0 170 200">
      <path class="frame" d="M20 190 L90 190 L45 190 L45 20 L120 20 L120 40"/>
      <g id="man">
        <path class="part" d="M120 40 a13 13 0 1 0 0.1 0"/>
        <path class="part" d="M120 66 L120 120"/>
        <path class="part" d="M120 80 L98 98"/>
        <path class="part" d="M120 80 L142 98"/>
        <path class="part" d="M120 120 L102 155"/>
        <path class="part" d="M120 120 L138 155"/>
      </g>
    </svg>
    <div style="display:flex;flex-direction:column;gap:14px;align-items:center">
      <div class="word" id="word"></div>
      <div id="msg">Tahmin etmek için tuşa bas ✏️</div>
    </div>
  </div>

  <div class="keys" id="keys"></div>
  <button class="big" id="newBtn">Yeni Oyun</button>
  <div class="hint">Fiziksel klavye de çalışır · Kazanma serini topla</div>

<script>
const WORDS = [
  ['yazilim', 'Bilgisayar programlarının sanatı'],
  ['ankara', 'Başkent'],
  ['karpuz', 'Yaz meyvesi, çekirdeği savrulur'],
  ['kitaplik', 'Evi donatan ahşap mobilya'],
  ['bulut', 'Gökte süzülen beyaz ağ'],
  ['gitar', '6 telli çalgı'],
  ['cömlek', 'Toprak testi'],
  ['mutfak', 'Evde yemek yapılan'],
  ['yildiz', 'Gecede parlayan'],
  ['bisiklet', 'Pedallı iki tekerlekli'],
  ['deniz', 'Yazın gidilen mavi'],
  ['çilek', 'Kırmızı, kokulu meyve'],
  ['bilgisayar', 'Masa üstünde duran alet'],
  ['gökkuşağı', 'Yağmur sonrası renkler'],
  ['şekerpâre', 'Tatlı kelime değil, kek türü'],
  ['maydanoz', 'Salonlara konan yeşil'],
  ['kütüphane', 'Kitapların evi'],
  ['zeytin', 'Sallanan, salamuralı'],
  ['fenerbahçe', 'Sarı-lacivert'],
  ['öğrenci', 'Okulda tahsilini yürüten']
];

const ALPH = 'abcçdefgğhıijklmnoöprsştuüvyz'.split('');
const MAX_WRONG = 6;

const wordEl = document.getElementById('word');
const keysEl = document.getElementById('keys');
const msgEl = document.getElementById('msg');
const scoreEl = document.getElementById('score');
const livesEl = document.getElementById('lives');
const parts = document.querySelectorAll('#man .part');

let target, hint, guessed, wrong, score = 0, done;

function pick() {
  return WORDS[Math.floor(Math.random() * WORDS.length)];
}

function newGame() {
  [target, hint] = pick();
  guessed = new Set();
  wrong = 0;
  done = false;
  msgEl.textContent = 'İpucu: ' + hint;
  livesEl.textContent = MAX_WRONG;
  renderWord();
  renderKeys();
  parts.forEach(p => p.style.visibility = 'hidden');
}

function renderWord() {
  wordEl.innerHTML = '';
  target.split('').forEach(ch => {
    const d = document.createElement('div');
    d.className = 'letter';
    d.textContent = guessed.has(ch) || done ? ch : '';
    if (done && !guessed.has(ch)) d.classList.add('wrong');
    wordEl.appendChild(d);
  });
}

function renderKeys() {
  keysEl.innerHTML = '';
  ALPH.forEach(ch => {
    const b = document.createElement('button');
    b.textContent = ch.toUpperCase();
    b.dataset.ch = ch;
    if (guessed.has(ch)) b.className = target.includes(ch) ? 'hit' : 'miss';
    b.onclick = () => guess(ch);
    keysEl.appendChild(b);
  });
}

function guess(ch) {
  if (done || guessed.has(ch)) return;
  guessed.add(ch);
  if (!target.includes(ch)) wrong++;

  if (target.includes(ch)) {
    if (target.split('').every(c => guessed.has(c))) {
      done = true;
      score += (MAX_WRONG - wrong) * 10 + 20;
      scoreEl.textContent = score;
      msgEl.textContent = 'Kazandın! 🎉 +puan';
      finish();
      return;
    }
  } else if (wrong >= MAX_WRONG) {
    done = true;
    msgEl.textContent = 'Kaybettin 💀 — cevap: ' + target;
    finish();
    return;
  }
  renderWord();
  renderKeys();
  livesEl.textContent = MAX_WRONG - wrong;
  msgEl.textContent = wrong > 0 ? 'Dikkat: ' + wrong + ' hatanda olabilir!' : 'Devam et!';
}

function finish() {
  renderWord();
  renderKeys();
  livesEl.textContent = MAX_WRONG - wrong;
}

document.addEventListener('keydown', e => {
  const ch = e.key.toLowerCase();
  if (ALPH.includes(ch)) guess(ch);
  if (e.key === 'Enter') newGame();
});

document.getElementById('newBtn').onclick = newGame;

parts.forEach(p => p.style.visibility = 'hidden');
newGame();
</script>
</body>
</html>
